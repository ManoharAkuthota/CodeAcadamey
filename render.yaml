# Render Infrastructure-as-Code Blueprint for CodePath Academy
# Automatically provisions and connects Backend (Spring Boot + TiDB) and Frontend (React + Vite)

services:
  # 1. Spring Boot 3 Backend Web Service
  - type: web
    name: codepath-academy-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: singapore
    envVars:
      - key: SERVER_PORT
        value: 8080
      - key: DB_URL
        value: jdbc:mysql://gateway01.ap-southeast-1.prod.aws.tidbcloud.com:4000/codepath_academy?useSSL=true&sslMode=VERIFY_IDENTITY&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - key: DB_USERNAME
        value: 3HVUhdVZBhSBCPs.root
      - key: DB_PASSWORD
        value: 6BP74bdgTlFpWzrm
      - key: JWT_SECRET
        value: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      - key: CORS_ORIGINS
        value: "http://localhost:*,https://*.vercel.app,https://*.onrender.com,https://*.netlify.app"

  # 2. React + Vite Frontend Static Web App
  - type: web
    name: codepath-academy-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://codepath-academy-backend.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
